{% extends 'base.html' %}
{% block title %}Ingresar · Auditoría Edu{% endblock %}
{% block content %}
<section id="login-page">
  <div class="login-card">
    <div class="login-logo">AE</div>
    <h1 class="login-title">Auditoría Edu</h1>
    <p class="login-sub">Iniciá sesión para continuar</p>

    <form method="post" action="{% url 'login' %}" novalidate>
      {% csrf_token %}
      <div class="form-field">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-input" id="username" name="username" type="text"
               placeholder="Usuario" autocomplete="username"
               autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-input" id="password" name="password" type="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn-submit" type="submit">INGRESAR</button>
      {% if error %}
        <div class="login-error show" role="alert">{{ error }}</div>
      {% endif %}
    </form>
  </div>
</section>
{% endblock %}
