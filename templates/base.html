{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Auditoría Edu{% endblock %}</title>
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="{% static 'manifest.json' %}">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231e3a5f'/><text x='16' y='21' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='700' fill='%23d4a84b'>AE</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}" class="logo">
      <div class="logo-mark">AE</div>
      <span class="logo-text">Auditoría Edu</span>
    </a>
    <div class="nav-right">
      <button class="nav-toggle" aria-label="Abrir menú" onclick="openMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<aside class="menu" id="menu">
  <div class="menu-header">
    <strong style="color:var(--primary); font-size:14px;">Menú</strong>
    <button class="menu-close" onclick="closeMenu()" aria-label="Cerrar">×</button>
  </div>
  <div class="menu-items">
    <a class="menu-item" href="{% url 'acerca' %}">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
        </svg>
      </span>
      Acerca de
    </a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" style="margin:0;">
        {% csrf_token %}
        <button class="menu-item" type="submit">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </span>
          Cerrar sesión
        </button>
      </form>
    {% else %}
      <a class="menu-item" href="{% url 'login' %}">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </span>
        Ingresar
      </a>
    {% endif %}
  </div>
</aside>

<main class="page active">{% block content %}{% endblock %}</main>

<footer>
  <span class="logo-mark footer-mark">AE</span> Auditoría Edu · v1.0
</footer>

<script>
  function openMenu(){
    document.getElementById('menu').classList.add('open');
    document.getElementById('menuOverlay').classList.add('open');
  }
  function closeMenu(){
    document.getElementById('menu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('open');
  }
  // PWA service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('{% static "service-worker.js" %}')
        .catch(err => console.warn('SW register failed', err));
    });
  }
</script>
{% block extra_js %}{% endblock %}

</body>
</html>
